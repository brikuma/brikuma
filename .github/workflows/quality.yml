name: BRIKUMA root quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-docs-and-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.evidence.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run prepare
      - run: node scripts/docs-check.mjs --mode=candidate --tree=HEAD
      - run: npm run format:check
      - run: npm run docs:test
      - run: npm run quality:test
      - run: python3 -B scripts/privacy-install.py
      - run: npm run hooks:check
      - run: npm run deps:audit
      - id: evidence
        run: echo "verified=true" >> "$GITHUB_OUTPUT"

  pinned-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verified: ${{ steps.evidence.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false
          set-safe-directory: false
      - name: Read exact committed child gitlinks
        id: pins
        shell: bash
        run: |
          for child in frontend backend infrastructure; do
            child_path="brikuma-$child"
            entry="$(git ls-tree HEAD -- "$child_path")"
            IFS=$' \t' read -r mode type sha path <<< "$entry"
            if [[ "$mode" != 160000 || "$type" != commit || ! "$sha" =~ ^[0-9a-f]{40}$ || "$path" != "$child_path" ]]; then
              echo "$child_path must be a committed mode-160000 gitlink." >&2
              exit 1
            fi
            printf '%s=%s\n' "$child" "$sha" >> "$GITHUB_OUTPUT"
          done
      - name: Check out the pinned frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: brikuma/brikuma-frontend
          path: brikuma-frontend
          ref: ${{ steps.pins.outputs.frontend }}
          persist-credentials: false
          set-safe-directory: false
      - name: Check out the pinned backend documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: brikuma/brikuma-backend
          path: brikuma-backend
          ref: ${{ steps.pins.outputs.backend }}
          persist-credentials: false
          set-safe-directory: false
      - name: Check out the pinned infrastructure documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: brikuma/brikuma-infrastructure
          path: brikuma-infrastructure
          ref: ${{ steps.pins.outputs.infrastructure }}
          persist-credentials: false
          set-safe-directory: false
      - name: Require each selected commit to belong to its protected main
        shell: bash
        run: |
          for child in frontend backend infrastructure; do
            child_path="brikuma-$child"
            git -C "$child_path" fetch --no-tags "https://github.com/brikuma/$child_path.git" main
            git -C "$child_path" merge-base --is-ancestor HEAD FETCH_HEAD
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run docs:integration
      - run: npm ci --ignore-scripts
        working-directory: brikuma-frontend
      - run: python3 -B scripts/privacy-install.py
        working-directory: brikuma-frontend
      - run: npm run check
        working-directory: brikuma-frontend
      - run: npm run build
        working-directory: brikuma-frontend
      - id: evidence
        run: echo "verified=true" >> "$GITHUB_OUTPUT"

  root-required-gate:
    if: always()
    needs: [root-docs-and-tooling, pinned-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful mandatory jobs and completion evidence
        env:
          DOCS_RESULT: ${{ needs.root-docs-and-tooling.result }}
          DOCS_EVIDENCE: ${{ needs.root-docs-and-tooling.outputs.verified }}
          INTEGRATION_RESULT: ${{ needs.pinned-integration.result }}
          INTEGRATION_EVIDENCE: ${{ needs.pinned-integration.outputs.verified }}
        run: |
          test "$DOCS_RESULT" = success
          test "$DOCS_EVIDENCE" = true
          test "$INTEGRATION_RESULT" = success
          test "$INTEGRATION_EVIDENCE" = true
